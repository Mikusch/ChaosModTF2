name: Compile and release

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: chaos
  SCRIPTS_PATH: addons/sourcemod/scripting

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - sm-version: '1.12.x'
            sm-label: 'sm1.12'
          - sm-version: '1.13.x'
            sm-label: 'sm1.13'

    outputs:
      plugin-version: ${{ steps.setup_sp.outputs.plugin-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download include files
        run: |
          set -euo pipefail
          includes=(
            "https://raw.githubusercontent.com/DoctorMcKay/sourcemod-plugins/master/scripting/include/morecolors.inc"
            "https://raw.githubusercontent.com/FlaminSarge/tf2attributes/refs/heads/master/scripting/include/tf2attributes.inc"
            "https://raw.githubusercontent.com/asherkin/TF2Items/refs/heads/master/pawn/tf2items.inc"
            "https://raw.githubusercontent.com/Mikusch/vscript-ext/refs/heads/master/include/vscript.inc"
            "https://raw.githubusercontent.com/nosoop/SM-TFEconData/refs/heads/master/scripting/include/tf_econ_data.inc"
          )

          mkdir -p "${{ env.SCRIPTS_PATH }}/include"

          for url in "${includes[@]}"; do
            echo "Downloading $url"
            curl --fail -sSL -O --output-dir "${{ env.SCRIPTS_PATH }}/include" "$url"
          done

      - name: Setup SourcePawn compiler
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm-version }}
          version-file: ${{ env.SCRIPTS_PATH }}/${{ env.PLUGIN_NAME }}.sp
          define-name: PLUGIN_VERSION

      - name: Compile plugin
        run: |
          set -euo pipefail
          mkdir -p ../plugins
          spcomp -v2 -E -i "include" -o "../plugins/${{ env.PLUGIN_NAME }}.smx" "${{ env.PLUGIN_NAME }}.sp"
        working-directory: ${{ env.SCRIPTS_PATH }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.sm-version }}
          path: addons/sourcemod/plugins/${{ env.PLUGIN_NAME }}.smx
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.sm-label }}
          path: |
            addons
            materials
            scripts
            shaders
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ github.event.repository.name }}-sm*
          path: packages

      - name: Zip packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in packages/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qq -r "$GITHUB_WORKSPACE/dist/${name}.zip" addons materials scripts shaders)
          done

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.build.outputs.plugin-version }}
          artifacts: dist/*.zip
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
